<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect width="1200" height="675" fill="url(#grid2)"/>
  
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="1"/>
    <text x="82" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PRODUCT &amp; UI/UX</text>
    
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">ArtZa Frames</text>
    <text x="0" y="155" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Personalized Custom Framing Experience</text>
    
    <!-- Flow visualizer -->
    <g transform="translate(0, 220)">
      <g>
        <circle cx="24" cy="24" r="24" fill="#181818" stroke="#ffffff" stroke-width="2"/>
        <text x="24" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">1</text>
        <text x="64" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="600">Photo Upload</text>
      </g>
      <path d="M 190 24 L 230 24" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4"/>
      <g transform="translate(250, 0)">
        <circle cx="24" cy="24" r="24" fill="#181818" stroke="#ffffff" stroke-width="2"/>
        <text x="24" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">2</text>
        <text x="64" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="600">Frame Size</text>
      </g>
      <path d="M 430 24 L 470 24" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4"/>
      <g transform="translate(490, 0)">
        <circle cx="24" cy="24" r="24" fill="#181818" stroke="#ffffff" stroke-width="2"/>
        <text x="24" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">3</text>
        <text x="64" y="30" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="600">Live Preview</text>
      </g>
    </g>
  </g>
  
  <!-- Right Isometric Mockup Frame -->
  <g transform="translate(760, 150)">
    <rect x="0" y="0" width="320" height="360" rx="16" fill="#181818" stroke="#ffffff" stroke-width="6"/>
    <rect x="30" y="30" width="260" height="300" fill="#ffffff" rx="4"/>
    <rect x="45" y="45" width="230" height="270" fill="#000000"/>
    <circle cx="160" cy="150" r="50" fill="#ffffff" opacity="0.3"/>
    <path d="M 90 280 L 160 210 L 230 280 Z" fill="#737373" opacity="0.9"/>
    <path d="M 170 280 L 210 235 L 255 280 Z" fill="#a3a3a3" opacity="0.9"/>
  </g>
</svg>
