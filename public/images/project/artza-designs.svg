<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  
  <!-- Subtle circular aura -->
  <circle cx="950" cy="200" r="300" fill="#ffffff" opacity="0.06" filter="blur(60px)"/>
  
  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="1"/>
    <text x="80" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">BRANDING &amp; DESIGN</text>
    
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">ArtZa Designs</text>
    <text x="0" y="155" fill="#a3a3a3" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Creative Design &amp; Brand Identity Initiative</text>
    
    <!-- Graphic Elements -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="180" height="90" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="24" y="38" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">SERVICES</text>
      <text x="24" y="66" fill="#f5f5f5" font-family="system-ui" font-size="18" font-weight="600">Visual Identity</text>
      
      <rect x="200" y="0" width="180" height="90" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="224" y="38" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">COMMUNICATION</text>
      <text x="224" y="66" fill="#f5f5f5" font-family="system-ui" font-size="18" font-weight="600">Posters &amp; Media</text>
      
      <rect x="400" y="0" width="180" height="90" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="424" y="38" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">EXPERIENCE</text>
      <text x="424" y="66" fill="#f5f5f5" font-family="system-ui" font-size="18" font-weight="600">UI/UX Design</text>
    </g>
  </g>
  
  <!-- Decorative Right Artwork -->
  <g transform="translate(750, 160)">
    <rect x="0" y="0" width="340" height="340" rx="24" fill="#181818" stroke="rgba(255,255,255,0.12)"/>
    <rect x="30" y="30" width="280" height="180" rx="16" fill="url(#accent)" opacity="0.9"/>
    <circle cx="170" cy="120" r="40" fill="#000000" opacity="0.25"/>
    <path d="M 155 120 L 185 120 M 170 105 L 170 135" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="30" y="240" width="160" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="30" y="270" width="220" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
  </g>
</svg>
