<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>
  <rect width="1200" height="675" fill="url(#grid5)"/>
  
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="1"/>
    <text x="95" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">NLP &amp; TEXT CLASSIFICATION</text>
    
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Fake News Detection</text>
    <text x="0" y="155" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Machine Learning Misinformation Filter</text>
    
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="180" height="85" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="35" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">INPUT DATA</text>
      <text x="20" y="62" fill="#f5f5f5" font-family="system-ui" font-size="16" font-weight="600">News Articles</text>
      
      <rect x="200" y="0" width="180" height="85" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="220" y="35" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">FEATURE EXTRACTION</text>
      <text x="220" y="62" fill="#f5f5f5" font-family="system-ui" font-size="16" font-weight="600">TF-IDF Vectorizer</text>
      
      <rect x="400" y="0" width="180" height="85" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)"/>
      <text x="420" y="35" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">INFERENCE</text>
      <text x="420" y="62" fill="#f5f5f5" font-family="system-ui" font-size="16" font-weight="600">Passive-Aggressive</text>
    </g>
  </g>
  
  <g transform="translate(760, 160)">
    <rect x="0" y="0" width="320" height="340" rx="20" fill="#181818" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="40" y="40" width="240" height="30" rx="6" fill="rgba(255,255,255,0.1)"/>
    <text x="50" y="60" fill="#ffffff" font-family="monospace" font-size="12">PREDICT: REAL (98.2%)</text>
    <rect x="40" y="90" width="240" height="12" rx="6" fill="rgba(255,255,255,0.2)"/>
    <rect x="40" y="115" width="200" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="40" y="140" width="220" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="40" y="180" width="240" height="120" rx="12" fill="#000000"/>
    <text x="60" y="220" fill="#ffffff" font-family="monospace" font-size="13">&gt; tokens = clean(text)</text>
    <text x="60" y="245" fill="#a3a3a3" font-family="monospace" font-size="13">&gt; vec = tfidf(tokens)</text>
    <text x="60" y="270" fill="#ffffff" font-family="monospace" font-size="13">&gt; score: Authentic</text>
  </g>
</svg>
